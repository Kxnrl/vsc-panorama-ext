name: CI

# 只做一件事：证明这份代码在干净环境里能过类型检查、能过单元测试、能构建、能打包。
# 发布是纯手动的（本地 `npm run package` 之后自己传），所以这里没有任何
# publish 步骤，也不需要配 secret。
on:
  push:
    branches: [master, main]
    # 文档-only 变更（README / CHANGELOG / LICENSE）不构建：真正的构建输入
    # 都列在下面。清单本身与工作流文件也算输入——改了它们等于改了构建。
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'data/**'
      - 'examples/**'
      - 'syntaxes/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'package.nls.json'
      - 'package.nls.zh-cn.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'esbuild.mjs'
      - 'esbuild-e2e.mjs'
      - 'language-configuration-vxml.json'
      - 'language-configuration-vcss.json'
      - '.vscodeignore'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'data/**'
      - 'examples/**'
      - 'syntaxes/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'package.nls.json'
      - 'package.nls.zh-cn.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'esbuild.mjs'
      - 'esbuild-e2e.mjs'
      - 'language-configuration-vxml.json'
      - 'language-configuration-vcss.json'
      - '.vscodeignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 而不是 20：test/unit/core/strip-types.test.ts 用的
          # node:module.stripTypeScriptTypes 是 Node 22.13+ 才有的 API，
          # tools/*.mts 也经 --experimental-strip-types 运行。
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 990 文件语料闸门需要 Valve 的解包归档，CI 上没有。tools/paths.mjs 拿不到
      # 归档时返回空串，闸门据此整套 skip，不依赖归档的断言照常执行——这是刻意
      # 设计的（见该文件顶部注释），不是这里在放水。
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # 打一次包：.vscodeignore 写漏、元数据缺项、dist 没构建，这些只有真打包
      # 才暴露得出来。vscode:prepublish 会在这一步里跑构建。
      - name: Package
        run: npm run package -- --out vsc-panorama-ext.vsix

      # 与 release.yml 同一道守卫：VSIX 里必须带 MCP daemon。esbuild 双入口
      # 配坏或 .vscodeignore 误排 dist/ 时，构建与单测都可能照常绿——发版
      # 工作流里有这道，CI 里再放一道，问题在 push 时就红，别等到打 tag。
      - name: VSIX 必须包含 MCP daemon
        run: |
          npx --yes @vscode/vsce@3 ls | grep -q '^dist/mcp-daemon\.cjs$' \
            || { echo '::error::VSIX 里没有 dist/mcp-daemon.cjs——MCP 通道会整个缺失'; exit 1; }

      - name: Show package contents
        run: npx --yes @vscode/vsce@3 ls

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsc-panorama-ext.vsix
          retention-days: 14

# E2E（`npm run test:e2e`）刻意不放进 CI：它要 xvfb 起真实 VS Code，本机实测
# 15 次里出现过 1 次 flake，放进来就是隔三差五无故变红。
#
# 代价必须写明：**E2E 是唯一能验证 vscode.env.language -> localeOf -> messagesFor
# 这条适配层接线的测试**（单元测试用的是 mock）。实测把接线写死成中文时，822 个
# 单元测试全绿、只有 E2E 红。所以它是发版前的手动必跑项，不是可选项。
